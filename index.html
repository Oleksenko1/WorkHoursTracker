<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐖</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Work Hours Tracker</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      /* Immediate dark background to eliminate white screen flash */
      html, body {
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Outfit', 'Inter', system-ui, sans-serif;
      }
      .fallback-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        box-sizing: border-box;
      }
      .fallback-card {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1.5rem;
        padding: 2rem;
        max-width: 24rem;
        width: 100%;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 3px solid rgba(34, 197, 94, 0.2);
        border-top-color: #22c55e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 1rem auto;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .btn-reload {
        margin-top: 1.25rem;
        padding: 0.75rem 1.5rem;
        background: linear-gradient(to right, #22c55e, #14b8a6);
        color: #020617;
        font-weight: 700;
        font-size: 0.875rem;
        border: none;
        border-radius: 0.75rem;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .btn-reload:active {
        transform: scale(0.96);
      }
    </style>

    <script>
      // 1. Ensure trailing slash on GitHub Pages URL for correct relative asset loading
      (function() {
        var path = window.location.pathname;
        if (!path.endsWith('/') && !path.includes('.')) {
          window.history.replaceState(null, '', path + '/' + window.location.search + window.location.hash);
        }
      })();

      // 2. Global Error Listener for 404 script loading failures
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = `
              <div class="fallback-container">
                <div class="fallback-card" style="border-color: rgba(244, 63, 94, 0.4);">
                  <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">⚠️</div>
                  <h2 style="font-size: 1.25rem; font-weight: 800; margin: 0 0 0.5rem 0; color: #ffffff;">Failed to Load App Resources (404)</h2>
                  <p style="font-size: 0.8125rem; color: #94a3b8; margin: 0; line-height: 1.5;">
                    The server returned a 404 error when requesting application bundle files. Please try reloading or check deployment settings.
                  </p>
                  <button onclick="window.location.reload()" class="btn-reload">Reload Application</button>
                </div>
              </div>
            `;
          }
        }
      }, true);
    </script>
    <script type="module" crossorigin src="./assets/index-BfOCvjIw.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DYxvWMxX.css">
  </head>
  <body class="h-full font-sans antialiased bg-slate-950 selection:bg-pink-500 selection:text-white overflow-x-hidden">
    <div id="root" class="h-full">
      <!-- Fallback Loading Card until React mounts -->
      <div class="fallback-container">
        <div class="fallback-card">
          <div class="spinner"></div>
          <h2 style="font-size: 1.125rem; font-weight: 700; margin: 0 0 0.25rem 0; color: #ffffff;">Work Hours Tracker</h2>
          <p style="font-size: 0.8125rem; color: #94a3b8; margin: 0;">Loading application...</p>
        </div>
      </div>
    </div>
  </body>
</html>
